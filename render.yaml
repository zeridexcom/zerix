services:
  # Zerix Main Web Application
  - type: web
    name: zerix-platform
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3001
      - key: BUSINESS_NAME
        value: Zerix
      - key: GOOGLE_REVIEW_URL
        value: https://g.page/r/YOUR_REVIEW_LINK/review
      - key: FOLLOW_UP_DAYS
        value: 3
      - key: OPENWA_API_URL
        fromService:
          type: web
          name: zerix-whatsapp-gateway
          property: host
      - key: OPENWA_API_KEY
        value: zerix_admin_api_key_2026
      - key: OPENWA_SESSION_ID
        value: default

  # Zerix WhatsApp Self-Hosted Gateway
  - type: web
    name: zerix-whatsapp-gateway
    env: docker
    dockerfilePath: ./Dockerfile.openwa
    plan: free
    envVars:
      - key: PORT
        value: 2785
      - key: API_MASTER_KEY
        value: zerix_admin_api_key_2026
      - key: ENGINE_TYPE
        value: baileys
      - key: AUTO_START_SESSIONS
        value: true
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_NAME
        value: /tmp/openwa.sqlite
